<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>선입선출</title>
<style>
  :root {
    --bg: #eef3f0;
    --phone-bg: #fbfdfc;
    --surface: #ffffff;
    --surface-2: #f2f6f4;
    --ink: #16221f;
    --ink-soft: #5c6b66;
    --ink-faint: #8b9995;
    --border: #dde6e1;
    --accent: #1f8a76;
    --accent-ink: #ffffff;
    --accent-soft: #e4f3ef;
    --critical: #c8412f;
    --critical-bg: #fbeae7;
    --critical-border: #f0c6bd;
    --warning: #a8681a;
    --warning-bg: #faf0dc;
    --warning-border: #eed7ac;
    --shadow: rgba(20, 40, 35, 0.16);
    --font-display: Georgia, "Iowan Old Style", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1211;
      --phone-bg: #121a18;
      --surface: #17211f;
      --surface-2: #1c2725;
      --ink: #e7efec;
      --ink-soft: #a3b3ae;
      --ink-faint: #6f8480;
      --border: #263330;
      --accent: #3fbaa0;
      --accent-ink: #08211b;
      --accent-soft: #17332c;
      --critical: #f0897a;
      --critical-bg: #34201d;
      --critical-border: #4a2b26;
      --warning: #e0ac5c;
      --warning-bg: #332812;
      --warning-border: #4a3a1c;
      --shadow: rgba(0, 0, 0, 0.55);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0c1211;
    --phone-bg: #121a18;
    --surface: #17211f;
    --surface-2: #1c2725;
    --ink: #e7efec;
    --ink-soft: #a3b3ae;
    --ink-faint: #6f8480;
    --border: #263330;
    --accent: #3fbaa0;
    --accent-ink: #08211b;
    --accent-soft: #17332c;
    --critical: #f0897a;
    --critical-bg: #34201d;
    --critical-border: #4a2b26;
    --warning: #e0ac5c;
    --warning-bg: #332812;
    --warning-border: #4a3a1c;
    --shadow: rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: clamp(16px, 4vw, 48px) 16px;
  }

  .stage {
    width: 100%;
    max-width: 960px;
    display: flex;
    gap: 40px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
  }

  .intro {
    max-width: 320px;
    padding-top: 28px;
  }

  .intro .kicker {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }

  .intro h1 {
    font-family: var(--font-display);
    font-size: 30px;
    line-height: 1.25;
    margin: 10px 0 12px;
    text-wrap: balance;
    font-weight: 400;
  }

  .intro p {
    color: var(--ink-soft);
    line-height: 1.65;
    font-size: 14.5px;
  }

  .phone {
    width: 390px;
    max-width: 100%;
    height: 780px;
    max-height: 92vh;
    background: var(--phone-bg);
    border-radius: 34px;
    border: 1px solid var(--border);
    box-shadow: 0 24px 60px -20px var(--shadow), 0 4px 16px -4px var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .app-header {
    padding: 22px 22px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand-mark svg { width: 20px; height: 20px; }

  .brand-text h2 {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 400;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .brand-text p {
    margin: 2px 0 0;
    font-size: 11.5px;
    color: var(--ink-faint);
  }

  .app-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px 28px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .app-scroll::-webkit-scrollbar { width: 6px; }
  .app-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  section { display: flex; flex-direction: column; gap: 10px; }

  .section-title {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .section-title .count { color: var(--ink-faint); font-weight: 400; text-transform: none; letter-spacing: 0; }

  .hero-card {
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 18px;
    padding: 18px;
  }

  .hero-headline {
    font-family: var(--font-display);
    font-size: 19px;
    line-height: 1.4;
    margin: 0 0 14px;
    text-wrap: balance;
  }

  .hero-headline strong { color: var(--accent); font-weight: 700; font-style: normal; }

  .hero-list { display: flex; flex-direction: column; gap: 8px; }

  .hero-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--surface);
    border-radius: 12px;
    padding: 10px 12px;
    border: 1px solid var(--border);
  }

  .hero-row .name { font-size: 14.5px; font-weight: 600; }

  .badge {
    font-family: var(--font-body);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .badge.critical { color: var(--critical); background: var(--critical-bg); border-color: var(--critical-border); }
  .badge.warning { color: var(--warning); background: var(--warning-bg); border-color: var(--warning-border); }
  .badge.neutral { color: var(--ink-soft); background: var(--surface-2); border-color: var(--border); }

  .empty-note {
    font-size: 13.5px;
    color: var(--ink-faint);
    padding: 14px 4px;
  }

  form.add-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .add-form .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
    min-width: 0;
  }

  .add-form .field span {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink-faint);
  }

  .add-form input {
    display: block;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    height: 42px;
    box-sizing: border-box;
    font-family: var(--font-body);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 0 10px;
    font-size: 13.5px;
    line-height: 40px;
    color: var(--ink);
  }

  .add-form input[type="date"] {
    -webkit-min-logical-width: 0px !important;
    -webkit-appearance: none;
    appearance: none;
  }

  .add-form input:focus-visible,
  button:focus-visible,
  summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .add-form button {
    flex: 1 1 100%;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 9px;
    padding: 10px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--font-body);
  }

  .add-form button:hover { filter: brightness(1.05); }

  .item-list { display: flex; flex-direction: column; gap: 8px; }

  .item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 11px 12px;
  }

  .item-row .info { flex: 1; min-width: 0; }
  .item-row .name { font-size: 14px; font-weight: 600; }
  .item-row .date { font-size: 11.5px; color: var(--ink-faint); margin-top: 1px; }

  .consume-btn {
    flex-shrink: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--ink-soft);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    border-radius: 8px;
    padding: 7px 10px;
    cursor: pointer;
  }

  .consume-btn:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .consume-btn.discard { color: var(--critical); border-color: var(--critical-border); background: var(--critical-bg); }
  .consume-btn.discard:hover { background: var(--critical); border-color: var(--critical); color: var(--accent-ink); }

  details.history {
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    overflow: hidden;
  }

  details.history summary {
    padding: 12px 14px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  details.history summary::-webkit-details-marker { display: none; }

  details.history summary::after {
    content: "▾";
    color: var(--ink-faint);
    transition: transform 0.15s ease;
  }

  details.history[open] summary::after { transform: rotate(180deg); }

  .history-list {
    display: flex;
    flex-direction: column;
    padding: 0 14px 12px;
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
  }

  .history-list::-webkit-scrollbar { width: 6px; }
  .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .history-row {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--ink-soft);
    padding: 6px 0;
    border-top: 1px solid var(--border);
  }

  .history-row:first-child { border-top: none; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="intro">
    <div class="kicker">냉장고 관리 서비스</div>
    <h1>냉장고 속 식재료들,<br>앱으로 먼저 보세요.</h1>
    <p>식재료와 소비기한을 등록해두면, 오늘 가장 먼저 먹어야 할 것부터 순서대로 정리해 보여줍니다. 소비기한이 임박한 식재료는 별도로 표시되어 한눈에 알 수 있어요.</p>
  </div>

  <div class="phone">
    <div class="app-header">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="color: var(--accent)">
          <rect x="5" y="2.5" width="14" height="19" rx="2.5"></rect>
          <line x1="5" y1="10" x2="19" y2="10"></line>
          <line x1="8" y1="5.5" x2="8" y2="7.5"></line>
          <line x1="8" y1="13" x2="8" y2="15"></line>
        </svg>
      </div>
      <div class="brand-text">
        <h2>선입선출</h2>
        <p>먼저 넣은 건, 먼저 드세요</p>
      </div>
    </div>

    <div class="app-scroll">
      <section>
        <div class="hero-card">
          <p class="hero-headline" id="heroHeadline"></p>
          <div class="hero-list" id="heroList"></div>
        </div>
      </section>

      <section>
        <div class="section-title">식재료 등록</div>
        <form class="add-form" id="addForm">
          <label class="field">
            <span>식재료명</span>
            <input type="text" name="name" placeholder="예: 콩나물" maxlength="20" required />
          </label>
          <label class="field">
            <span>소비기한</span>
            <input type="date" name="expiry" required />
          </label>
          <button type="submit">냉장고에 등록</button>
        </form>
      </section>

      <section>
        <div class="section-title">
          <span>냉장고 속 식재료</span>
          <span class="count" id="itemCount"></span>
        </div>
        <div class="item-list" id="itemList"></div>
      </section>

      <details class="history">
        <summary>소비 완료 기록<span id="historyCount"></span></summary>
        <div class="history-list" id="historyList"></div>
      </details>
    </div>
  </div>
</div>

<script>
  (function () {
    var todaySeed = new Date();
    todaySeed.setHours(0, 0, 0, 0);

    function isoPlusDays(base, days) {
      var d = new Date(base);
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    }

    var state = {
      items: [
        { id: "seed-1", name: "콩나물", expiry: isoPlusDays(todaySeed, 1) },
        { id: "seed-2", name: "소세지", expiry: isoPlusDays(todaySeed, 5) },
        { id: "seed-3", name: "계란", expiry: isoPlusDays(todaySeed, 7) }
      ],
      history: []
    };

    var storageAvailable = true;
    try {
      var testKey = "__fridge_test__";
      window.localStorage.setItem(testKey, "1");
      window.localStorage.removeItem(testKey);
    } catch (e) {
      storageAvailable = false;
    }

    function loadState() {
      if (!storageAvailable) return;
      try {
        var saved = window.localStorage.getItem("fridge_state_v1");
        if (saved) {
          var parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.items) && Array.isArray(parsed.history)) {
            state = parsed;
          }
        }
      } catch (e) {}
    }

    function saveState() {
      if (!storageAvailable) return;
      try {
        window.localStorage.setItem("fridge_state_v1", JSON.stringify(state));
      } catch (e) {}
    }

    loadState();

    function today() {
      var d = new Date();
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function dDay(expiry) {
      var exp = new Date(expiry + "T00:00:00");
      var diff = Math.round((exp - today()) / 86400000);
      return diff;
    }

    function dDayLabel(diff) {
      if (diff < 0) return "기한 " + Math.abs(diff) + "일 지남";
      if (diff === 0) return "D-DAY";
      return "D-" + diff;
    }

    function dDayClass(diff) {
      if (diff <= 1) return "critical";
      if (diff <= 3) return "warning";
      return "neutral";
    }

    function formatDate(iso) {
      var d = new Date(iso + "T00:00:00");
      return (d.getMonth() + 1) + "월 " + d.getDate() + "일까지";
    }

    function formatHistoryDate(ts, action) {
      var d = new Date(ts);
      return (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + (action === "discard" ? "폐기 완료" : "소비 완료");
    }

    function josaEul(word) {
      if (!word) return "을";
      var ch = word[word.length - 1];
      var code = ch.charCodeAt(0) - 0xac00;
      if (code < 0 || code > 11171) return "을";
      var jong = code % 28;
      return jong === 0 ? "를" : "을";
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function sortedItems() {
      return state.items.slice().sort(function (a, b) {
        return dDay(a.expiry) - dDay(b.expiry);
      });
    }

    function render() {
      var sorted = sortedItems();
      var heroHeadline = document.getElementById("heroHeadline");
      var heroList = document.getElementById("heroList");
      var itemList = document.getElementById("itemList");
      var itemCount = document.getElementById("itemCount");
      var historyList = document.getElementById("historyList");
      var historyCount = document.getElementById("historyCount");

      if (sorted.length === 0) {
        heroHeadline.innerHTML = "등록된 식재료가 없어요. 첫 식재료를 등록해보세요!";
        heroList.innerHTML = "";
      } else {
        var top = sorted.slice(0, 3);
        var first = top[0];
        heroHeadline.innerHTML =
          "오늘은 <strong>" + escapeHtml(first.name) + "</strong>" + josaEul(first.name) + " 먼저 드세요!";
        heroList.innerHTML = top
          .map(function (it) {
            var diff = dDay(it.expiry);
            return (
              '<div class="hero-row"><span class="name">' +
              escapeHtml(it.name) +
              '</span><span class="badge ' +
              dDayClass(diff) +
              '">' +
              dDayLabel(diff) +
              "</span></div>"
            );
          })
          .join("");
      }

      itemCount.textContent = sorted.length + "개";
      if (sorted.length === 0) {
        itemList.innerHTML = '<p class="empty-note">냉장고가 비어 있어요.</p>';
      } else {
        itemList.innerHTML = sorted
          .map(function (it) {
            var diff = dDay(it.expiry);
            var isOverdue = diff < 0;
            return (
              '<div class="item-row"><div class="info"><div class="name">' +
              escapeHtml(it.name) +
              '</div><div class="date">' +
              formatDate(it.expiry) +
              '</div></div><span class="badge ' +
              dDayClass(diff) +
              '">' +
              dDayLabel(diff) +
              '</span><button class="consume-btn' +
              (isOverdue ? " discard" : "") +
              '" data-consume="' +
              it.id +
              '">' +
              (isOverdue ? "폐기 완료" : "소비 완료") +
              "</button></div>"
            );
          })
          .join("");
      }

      var histSorted = state.history.slice().sort(function (a, b) {
        return b.consumedAt - a.consumedAt;
      });
      historyCount.textContent = histSorted.length ? " · " + histSorted.length + "건" : "";
      historyList.innerHTML = histSorted.length
        ? histSorted
            .map(function (h) {
              return (
                '<div class="history-row"><span>' +
                escapeHtml(h.name) +
                "</span><span>" +
                formatHistoryDate(h.consumedAt, h.action) +
                "</span></div>"
              );
            })
            .join("")
        : '<p class="empty-note">아직 소비 기록이 없어요.</p>';
    }

    document.getElementById("addForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var form = e.target;
      var name = form.elements["name"].value.trim();
      var expiry = form.elements["expiry"].value;
      if (!name || !expiry) return;
      state.items.push({
        id: "item-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7),
        name: name,
        expiry: expiry
      });
      saveState();
      render();
      form.reset();
      form.elements["name"].focus();
    });

    document.getElementById("itemList").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-consume]");
      if (!btn) return;
      var id = btn.getAttribute("data-consume");
      var idx = state.items.findIndex(function (it) {
        return it.id === id;
      });
      if (idx === -1) return;
      var consumed = state.items.splice(idx, 1)[0];
      state.history.push({
        id: "hist-" + Date.now(),
        name: consumed.name,
        consumedAt: Date.now(),
        action: dDay(consumed.expiry) < 0 ? "discard" : "consume"
      });
      saveState();
      render();
    });

    render();
  })();
</script>
</body>
</html>
