<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>선입선출</title>
<style>
  :root {
    --bg: #eef3f0;
    --phone-bg: #fbfdfc;
    --surface: #ffffff;
    --surface-2: #f2f6f4;
    --ink: #16221f;
    --ink-soft: #5c6b66;
    --ink-faint: #8b9995;
    --border: #dde6e1;
    --accent: #1f8a76;
    --accent-ink: #ffffff;
    --accent-soft: #e4f3ef;
    --critical: #c8412f;
    --critical-bg: #fbeae7;
    --critical-border: #f0c6bd;
    --warning: #a8681a;
    --warning-bg: #faf0dc;
    --warning-border: #eed7ac;
    --shadow: rgba(20, 40, 35, 0.16);
    --font-display: Georgia, "Iowan Old Style", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1211;
      --phone-bg: #121a18;
      --surface: #17211f;
      --surface-2: #1c2725;
      --ink: #e7efec;
      --ink-soft: #a3b3ae;
      --ink-faint: #6f8480;
      --border: #263330;
      --accent: #3fbaa0;
      --accent-ink: #08211b;
      --accent-soft: #17332c;
      --critical: #f0897a;
      --critical-bg: #34201d;
      --critical-border: #4a2b26;
      --warning: #e0ac5c;
      --warning-bg: #332812;
      --warning-border: #4a3a1c;
      --shadow: rgba(0, 0, 0, 0.55);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0c1211;
    --phone-bg: #121a18;
    --surface: #17211f;
    --surface-2: #1c2725;
    --ink: #e7efec;
    --ink-soft: #a3b3ae;
    --ink-faint: #6f8480;
    --border: #263330;
    --accent: #3fbaa0;
    --accent-ink: #08211b;
    --accent-soft: #17332c;
    --critical: #f0897a;
    --critical-bg: #34201d;
    --critical-border: #4a2b26;
    --warning: #e0ac5c;
    --warning-bg: #332812;
    --warning-border: #4a3a1c;
    --shadow: rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: clamp(16px, 4vw, 48px) 16px;
  }

  .stage {
    width: 100%;
    max-width: 960px;
    display: flex;
    gap: 40px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
  }

  .intro {
    max-width: 320px;
    padding-top: 28px;
  }

  .intro .kicker {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }

  .intro h1 {
    font-family: var(--font-display);
    font-size: 30px;
    line-height: 1.25;
    margin: 10px 0 12px;
    text-wrap: balance;
    font-weight: 400;
  }

  .intro p {
    color: var(--ink-soft);
    line-height: 1.65;
    font-size: 14.5px;
  }

  .phone {
    width: 390px;
    max-width: 100%;
    height: 780px;
    max-height: 92vh;
    background: var(--phone-bg);
    border-radius: 34px;
    border: 1px solid var(--border);
    box-shadow: 0 24px 60px -20px var(--shadow), 0 4px 16px -4px var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .app-header {
    padding: 22px 22px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand-mark svg { width: 20px; height: 20px; }

  .brand-text h2 {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 400;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .brand-text p {
    margin: 2px 0 0;
    font-size: 11.5px;
    color: var(--ink-faint);
  }

  .app-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px 28px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .app-scroll::-webkit-scrollbar { width: 6px; }
  .app-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  section { display: flex; flex-direction: column; gap: 10px; }
  section[hidden] { display: none; }

  .section-title {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .section-title .count { color: var(--ink-faint); font-weight: 400; text-transform: none; letter-spacing: 0; }

  .hero-card {
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 18px;
    padding: 18px;
  }

  .hero-headline {
    font-family: var(--font-display);
    font-size: 19px;
    line-height: 1.4;
    margin: 0 0 14px;
    text-wrap: balance;
  }

  .hero-headline strong { color: var(--accent); font-weight: 700; font-style: normal; }

  .hero-list { display: flex; flex-direction: column; gap: 8px; }

  .hero-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--surface);
    border-radius: 12px;
    padding: 10px 12px;
    border: 1px solid var(--border);
  }

  .hero-row .name { font-size: 14.5px; font-weight: 600; }

  .badge {
    font-family: var(--font-body);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .badge.critical { color: var(--critical); background: var(--critical-bg); border-color: var(--critical-border); }
  .badge.warning { color: var(--warning); background: var(--warning-bg); border-color: var(--warning-border); }
  .badge.neutral { color: var(--ink-soft); background: var(--surface-2); border-color: var(--border); }

  .empty-note {
    font-size: 13.5px;
    color: var(--ink-faint);
    padding: 14px 4px;
  }

  form.add-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .add-form .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
    min-width: 0;
  }

  .add-form .field span {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink-faint);
  }

  .add-form input {
    display: block;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    height: 42px;
    box-sizing: border-box;
    font-family: var(--font-body);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 0 10px;
    font-size: 13.5px;
    line-height: 40px;
    color: var(--ink);
  }

  .add-form input[type="date"] {
    -webkit-min-logical-width: 0px !important;
    -webkit-appearance: none;
    appearance: none;
  }

  .add-form input:focus-visible,
  button:focus-visible,
  summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .add-form button {
    flex: 1 1 100%;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 9px;
    padding: 10px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--font-body);
  }

  .add-form button:hover { filter: brightness(1.05); }

  .item-list { display: flex; flex-direction: column; gap: 8px; }

  .item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 11px 12px;
  }

  .item-row .info { flex: 1; min-width: 0; }
  .item-row .name { font-size: 14px; font-weight: 600; }
  .item-row .date { font-size: 11.5px; color: var(--ink-faint); margin-top: 1px; }

  .consume-btn {
    flex-shrink: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--ink-soft);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    border-radius: 8px;
    padding: 7px 10px;
    cursor: pointer;
  }

  .consume-btn:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .consume-btn.discard { color: var(--critical); border-color: var(--critical-border); background: var(--critical-bg); }
  .consume-btn.discard:hover { background: var(--critical); border-color: var(--critical); color: var(--accent-ink); }

  details.history {
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    overflow: hidden;
  }

  details.history summary {
    padding: 12px 14px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  details.history summary::-webkit-details-marker { display: none; }

  details.history summary::after {
    content: "▾";
    color: var(--ink-faint);
    transition: transform 0.15s ease;
  }

  details.history[open] summary::after { transform: rotate(180deg); }

  .history-list {
    display: flex;
    flex-direction: column;
    padding: 0 14px 12px;
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
  }

  .history-list::-webkit-scrollbar { width: 6px; }
  .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .history-row {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--ink-soft);
    padding: 6px 0;
    border-top: 1px solid var(--border);
  }

  .history-row:first-child { border-top: none; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="intro">
    <div class="kicker">냉장고 관리 서비스</div>
    <h1>냉장고 속 식재료들,<br>앱으로 먼저 보세요.</h1>
    <p>식재료와 소비기한을 등록해두면, 오늘 가장 먼저 먹어야 할 것부터 순서대로 정리해 보여줍니다. 소비기한이 임박한 식재료는 별도로 표시되어 한눈에 알 수 있어요.</p>
  </div>

  <div class="phone">
    <div class="app-header">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="color: var(--accent)">
          <rect x="5" y="2.5" width="14" height="19" rx="2.5"></rect>
          <line x1="5" y1="10" x2="19" y2="10"></line>
          <line x1="8" y1="5.5" x2="8" y2="7.5"></line>
          <line x1="8" y1="13" x2="8" y2="15"></line>
        </svg>
      </div>
      <div class="brand-text">
        <h2>선입선출</h2>
        <p>먼저 넣은 건, 먼저 드세요</p>
      </div>
    </div>

    <div class="app-scroll" id="appScroll">
      <section>
        <div class="hero-card">
          <p class="hero-headline" id="heroHeadline"></p>
          <div class="hero-list" id="heroList"></div>
        </div>
      </section>

      <section>
        <div class="section-title">식재료 등록</div>
        <form class="add-form" id="addForm">
          <label class="field">
            <span>식재료명</span>
            <input type="text" name="name" placeholder="예: 콩나물" maxlength="20" required />
          </label>
          <label class="field">
            <span>소비기한</span>
            <input type="date" name="expiry" required />
          </label>
          <button type="submit">냉장고에 등록</button>
        </form>
      </section>

      <section>
        <div class="section-title">
          <span>냉장고 속 식재료</span>
          <span class="count" id="itemCount"></span>
        </div>
        <div class="item-list" id="itemList"></div>
      </section>

      <section id="discardSection" hidden>
        <div class="section-title">
          <span>폐기해야 할 식재료</span>
          <span class="count" id="discardCount"></span>
        </div>
        <div class="item-list" id="discardList"></div>
      </section>

      <details class="history">
        <summary>소비 완료 기록<span id="historyCount"></span></summary>
        <div class="history-list" id="historyList"></div>
      </details>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  (function () {
    // SUPABASE_URL / SUPABASE_ANON_KEY는 Vercel 환경변수로 설정되고,
    // /api/config 서버리스 함수를 통해 런타임에 전달됩니다.
    var supabaseClient = null;
    var rows = [];

    function today() {
      var d = new Date();
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function dDay(expiry) {
      var exp = new Date(expiry + "T00:00:00");
      var diff = Math.round((exp - today()) / 86400000);
      return diff;
    }

    function dDayLabel(diff) {
      if (diff < 0) return "기한 " + Math.abs(diff) + "일 지남";
      if (diff === 0) return "D-DAY";
      return "D-" + diff;
    }

    function dDayClass(diff) {
      if (diff <= 1) return "critical";
      if (diff <= 3) return "warning";
      return "neutral";
    }

    function formatDate(iso) {
      var d = new Date(iso + "T00:00:00");
      return (d.getMonth() + 1) + "월 " + d.getDate() + "일까지";
    }

    function formatHistoryDate(ts, action) {
      var d = new Date(ts);
      return (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + (action === "discard" ? "폐기 완료" : "소비 완료");
    }

    function josaEul(word) {
      if (!word) return "을";
      var ch = word[word.length - 1];
      var code = ch.charCodeAt(0) - 0xac00;
      if (code < 0 || code > 11171) return "을";
      var jong = code % 28;
      return jong === 0 ? "를" : "을";
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function itemRow(it, isOverdue) {
      var diff = dDay(it.expiry_date);
      return (
        '<div class="item-row"><div class="info"><div class="name">' +
        escapeHtml(it.name) +
        '</div><div class="date">' +
        formatDate(it.expiry_date) +
        '</div></div><span class="badge ' +
        dDayClass(diff) +
        '">' +
        dDayLabel(diff) +
        '</span><button class="consume-btn' +
        (isOverdue ? " discard" : "") +
        '" data-consume="' +
        it.id +
        '">' +
        (isOverdue ? "폐기 완료" : "소비 완료") +
        "</button></div>"
      );
    }

    function splitRows() {
      var active = rows.filter(function (r) { return !r.consumed && !r.discarded; });
      active.sort(function (a, b) { return dDay(a.expiry_date) - dDay(b.expiry_date); });
      var fresh = active.filter(function (r) { return dDay(r.expiry_date) >= 0; });
      var overdue = active.filter(function (r) { return dDay(r.expiry_date) < 0; });
      var history = rows
        .filter(function (r) { return r.consumed || r.discarded; })
        .sort(function (a, b) {
          var at = new Date(a.consumed_at || a.discarded_at).getTime();
          var bt = new Date(b.consumed_at || b.discarded_at).getTime();
          return bt - at;
        });
      return { fresh: fresh, overdue: overdue, history: history };
    }

    function render() {
      var split = splitRows();
      var fresh = split.fresh;
      var overdue = split.overdue;
      var histSorted = split.history;

      var heroHeadline = document.getElementById("heroHeadline");
      var heroList = document.getElementById("heroList");
      var itemList = document.getElementById("itemList");
      var itemCount = document.getElementById("itemCount");
      var discardSection = document.getElementById("discardSection");
      var discardList = document.getElementById("discardList");
      var discardCount = document.getElementById("discardCount");
      var historyList = document.getElementById("historyList");
      var historyCount = document.getElementById("historyCount");

      if (fresh.length === 0 && overdue.length === 0) {
        heroHeadline.innerHTML = "등록된 식재료가 없어요. 첫 식재료를 등록해보세요!";
        heroList.innerHTML = "";
      } else if (fresh.length === 0) {
        heroHeadline.innerHTML = "지금 바로 드실 수 있는 식재료가 없어요. 폐기 목록을 확인해보세요.";
        heroList.innerHTML = "";
      } else {
        var top = fresh.slice(0, 3);
        var first = top[0];
        heroHeadline.innerHTML =
          "오늘은 <strong>" + escapeHtml(first.name) + "</strong>" + josaEul(first.name) + " 먼저 드세요!";
        heroList.innerHTML = top
          .map(function (it) {
            var diff = dDay(it.expiry_date);
            return (
              '<div class="hero-row"><span class="name">' +
              escapeHtml(it.name) +
              '</span><span class="badge ' +
              dDayClass(diff) +
              '">' +
              dDayLabel(diff) +
              "</span></div>"
            );
          })
          .join("");
      }

      itemCount.textContent = fresh.length + "개";
      if (fresh.length === 0) {
        itemList.innerHTML =
          '<p class="empty-note">' +
          (overdue.length > 0 ? "지금 소비 가능한 식재료가 없어요." : "냉장고가 비어 있어요.") +
          "</p>";
      } else {
        itemList.innerHTML = fresh
          .map(function (it) {
            return itemRow(it, false);
          })
          .join("");
      }

      if (overdue.length === 0) {
        discardSection.hidden = true;
        discardList.innerHTML = "";
      } else {
        discardSection.hidden = false;
        discardCount.textContent = overdue.length + "개";
        discardList.innerHTML = overdue
          .map(function (it) {
            return itemRow(it, true);
          })
          .join("");
      }

      historyCount.textContent = histSorted.length ? " · " + histSorted.length + "건" : "";
      historyList.innerHTML = histSorted.length
        ? histSorted
            .map(function (h) {
              var ts = h.consumed_at || h.discarded_at;
              var action = h.consumed ? "consume" : "discard";
              return (
                '<div class="history-row"><span>' +
                escapeHtml(h.name) +
                "</span><span>" +
                formatHistoryDate(ts, action) +
                "</span></div>"
              );
            })
            .join("")
        : '<p class="empty-note">아직 소비 기록이 없어요.</p>';
    }

    function setupNotice() {
      var heroHeadline = document.getElementById("heroHeadline");
      heroHeadline.innerHTML =
        "Supabase 설정이 필요해요.<br>Vercel 프로젝트에 SUPABASE_URL / SUPABASE_ANON_KEY 환경변수를 등록해주세요.";
      document.getElementById("itemList").innerHTML = '<p class="empty-note">설정 후 이용할 수 있어요.</p>';
      var form = document.getElementById("addForm");
      Array.prototype.forEach.call(form.querySelectorAll("input, button"), function (el) {
        el.disabled = true;
      });
    }

    async function loadConfig() {
      try {
        var res = await fetch("/api/config");
        if (!res.ok) return null;
        var cfg = await res.json();
        if (!cfg || !cfg.url || !cfg.anonKey) return null;
        return cfg;
      } catch (err) {
        return null;
      }
    }

    async function ensureSession() {
      var sessionRes = await supabaseClient.auth.getSession();
      var session = sessionRes.data && sessionRes.data.session;
      if (!session) {
        var signInRes = await supabaseClient.auth.signInAnonymously();
        if (signInRes.error) throw signInRes.error;
      }
    }

    async function loadIngredients() {
      var heroHeadline = document.getElementById("heroHeadline");
      heroHeadline.textContent = "불러오는 중...";
      try {
        await ensureSession();
        var res = await supabaseClient.from("ingredients").select("*");
        if (res.error) throw res.error;
        rows = res.data || [];
      } catch (err) {
        rows = [];
        heroHeadline.textContent = "데이터를 불러오지 못했어요. 새로고침해 주세요.";
        return;
      }
      render();
    }

    async function addIngredientRemote(name, expiry) {
      var res = await supabaseClient.from("ingredients").insert({ name: name, expiry_date: expiry }).select();
      if (res.error) {
        alert("등록에 실패했어요: " + res.error.message);
        return;
      }
      rows = rows.concat(res.data);
      render();
    }

    async function markRow(id, isOverdue) {
      var patch = isOverdue
        ? { discarded: true, discarded_at: new Date().toISOString() }
        : { consumed: true, consumed_at: new Date().toISOString() };
      var res = await supabaseClient.from("ingredients").update(patch).eq("id", id).select();
      if (res.error) {
        alert("처리에 실패했어요: " + res.error.message);
        return;
      }
      var updated = res.data && res.data[0];
      if (updated) {
        rows = rows.map(function (r) {
          return r.id === id ? updated : r;
        });
      }
      render();
    }

    document.getElementById("addForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var form = e.target;
      var name = form.elements["name"].value.trim();
      var expiry = form.elements["expiry"].value;
      if (!name || !expiry) return;
      addIngredientRemote(name, expiry);
      form.reset();
      form.elements["name"].focus();
    });

    document.getElementById("appScroll").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-consume]");
      if (!btn) return;
      var id = btn.getAttribute("data-consume");
      var row = rows.find(function (r) {
        return r.id === id;
      });
      if (!row) return;
      markRow(id, dDay(row.expiry_date) < 0);
    });

    loadConfig().then(function (cfg) {
      if (!cfg) {
        setupNotice();
        return;
      }
      supabaseClient = window.supabase.createClient(cfg.url, cfg.anonKey);
      loadIngredients();
    });
  })();
</script>
</body>
</html>
